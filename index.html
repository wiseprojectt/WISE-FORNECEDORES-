// ===== Camada de dados (localStorage). Trocar por chamadas ao Supabase (RPCs do arquivo SQL) depois =====
let S=JSON.parse(localStorage.getItem(K)||'null')||{users:[{id:1,nome:'Diretor',email:'diretor@wise.com',senha:'administrador',role:'admin',ativo:1,misc:0}],sup:[],inv:[],pay:[],led:[],exp:[],log:[],n:10};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function addSup(nome,doc){doc=dg(doc);if(!nome||![11,14].includes(doc.length)){alert('Informe nome e CPF/CNPJ válido (11 ou 14 dígitos).');return}
 let s=S.sup.find(x=>x.doc==doc);if(!s){s={id:nid(),cod:S.sup.length+1,nome,doc,ativo:1};S.sup.push(s);log('fornecedor criado',nome)}return s}

 if(S.inv.some(x=>x.sup==s.id&&x.num==v('nn')&&x.st=='ativa'))return alert('NF já lançada para este fornecedor.');
 const i={id:nid(),sup:s.id,num:v('nn'),val,obs:v('no'),st:'ativa',u:me.id,ts:Date.now()};S.inv.push(i);led(s.id,'nota_fiscal',val,i.id);log('NF lançada',v('nn'));save();go('nf')}
function appr(i,c){const p=S.pay.find(x=>x.id==i);if(!['ag','an'].includes(p.st))return;
 if(p.txid&&S.pay.some(x=>x.id!=i&&x.st=='ap'&&(x.txid||'').toLowerCase()==p.txid.toLowerCase()))return alert('Esse ID de transação já foi aprovado em outro pagamento.');
 let j=null;if(p.val>saldo(p.sup)){if(!c){p.st='an';save();alert('Pagamento maior que o saldo: requer análise. Aprove novamente para confirmar crédito.');return go()}
  j=prompt('Pagamento maior que o saldo; o excedente vira crédito. Justificativa:');if(!j)return}
 p.st='ap';p.by=me.id;p.at=Date.now();p.motivo=j||p.motivo;led(p.sup,'pagamento',-p.val,p.id,j);log('pagamento aprovado',p.id);save();go()}

function est(i){const l=S.led.find(x=>x.id==i),j=prompt('Justificativa do estorno:');if(!j)return;led(l.sup,'estorno',-l.val,l.id,j);
 if(l.tipo=='pagamento')S.pay.find(x=>x.id==l.ref).st='es';if(l.tipo=='nota_fiscal')S.inv.find(x=>x.id==l.ref).st='cancelada';log('estorno',i);save();go('sup',l.sup)}
function ajuste(s){const x=parseFloat(v('aj').replace(',','.')),j=v('ajj');if(!x||!j)return alert('Informe valor (+/−) e justificativa.');led(s,'ajuste',x,null,j);log('ajuste',s);save();go('sup',s)}
function inicial(s){const x=parseFloat(v('si').replace(',','.'));if(!x||S.led.some(l=>l.sup==s&&l.tipo=='saldo_inicial'))return alert('Valor inválido ou saldo inicial já lançado (use ajuste).');led(s,'saldo_inicial',x,null,'Saldo inicial');save();go('sup',s)}
function addSupForm(){const s=addSup(v('fn'),v('fd'));if(!s)return;const x=parseFloat(v('fs').replace(',','.'));if(x&&!S.led.some(l=>l.sup==s.id))led(s.id,'saldo_inicial',x,null,'Saldo inicial');save();go('sup')}
function envia(){const val=parseFloat(v('pv').replace(',','.'));if(!v('ps')||!(val>0)||!v('pd'))return alert('Fornecedor, valor e data são obrigatórios.');

 if(arg){Object.assign(S.pay.find(x=>x.id==arg),o,{st:'ag'})}else S.pay.push({id:nid(),...o,st:'ag',u:me.id,ts:Date.now()});
 log('comprovante enviado',v('pv'));save();go(me.role=='admin'?'apr':'mine')}
function expSave(){const val=parseFloat(v('ev').replace(',','.'));if(!v('ed')||!(val>0)||!v('ex'))return alert('Data, descrição e valor são obrigatórios.');
 S.exp.push({id:nid(),data:v('ex'),desc:v('ed'),est:v('ee'),cat:v('ec')||'Sem categoria',val,forma:v('ef'),pagador:v('ep'),arq:($('#ea').files[0]||{}).name,st:'ag',u:me.id,ts:Date.now()});log('despesa avulsa',val);save();go('exp')}
function expDec(i,st){const x=S.exp.find(y=>y.id==i);let m=null;if(st!='ap'){m=prompt('Motivo:');if(!m)return}x.st=st;x.motivo=m;x.by=me.id;save();go('exp')} // nunca toca o ledger
function userAdd(){const p=v('ue').toLowerCase().split('@')[0].replace(/[^a-z0-9._-]/g,'');if(!p||v('up').length<6)return alert('Informe o usuário e uma senha com 6+ caracteres.');if(S.users.some(x=>!x.del&&x.email==p+'@wise.com'))return alert('Esse usuário já existe.');S.users.push({id:nid(),nome:cap(p),email:p+'@wise.com',senha:v('up'),role:v('ur'),ativo:1,misc:0});save();go('usr')}
function userDel(i){const u=S.users.find(x=>x.id==i);if(u.id==me.id)return alert('Você não pode excluir a si mesmo.');if(u.role=='admin'&&S.users.filter(x=>x.role=='admin'&&!x.del).length<2)return alert('Não é possível excluir o último administrador.');if(!confirm('Excluir o usuário '+u.nome+'? Os lançamentos que ele já fez continuam no histórico.'))return;u.del=1;u.ativo=0;u.misc=0;log('usuário excluído',i);save();go('usr')}
function wl(){const p=v('em').split('@')[0];$('#wl').innerHTML=p?'Bem-vindo,<br><b style="color:var(--bl)">'+e(cap(p))+'</b>':'Bem-vindo à<br><b style="color:var(--bl)">Wise</b>'}
function userMisc(i){const cur=S.users.find(x=>x.misc);if(cur&&cur.id!=i&&!confirm('Transferir a permissão de '+cur.nome+' para este funcionário?'))return;S.users.forEach(x=>x.misc=0);S.users.find(x=>x.id==i).misc=1;log('permissão despesas avulsas',i);save();go('usr')}
function login(){const p=v('em').toLowerCase().split('@')[0],u=S.users.find(x=>!x.del&&x.ativo&&x.email==p+'@wise.com'&&x.senha==$('#pw').value);if(!u)return alert('Usuário ou senha inválidos.');me=u;sessionStorage.u=u.id;page='home';render()}

const shrink=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=no;im.src=u});
// Leitura automática do comprovante (Gemini via Supabase). Se falhar, a pessoa preenche manualmente.
async function lerArq(inp){const f=inp.files[0],box=$('#ia');if(!f)return;
 const say=(t,w)=>{box.style.display='block';box.style.borderColor=w?'var(--o)':'var(--ok)';box.innerHTML=t};
 say('⏳ Lendo o comprovante…');
 try{let b,mime=f.type;
  if(mime=='application/pdf'){if(f.size>4e6)throw 'grande';b=await toB64(f)}
  else if(mime.startsWith('image/')){b=await shrink(f);mime='image/jpeg'}
  else throw 'tipo';
  const c=new AbortController(),t=setTimeout(()=>c.abort(),45000);
  const r=await fetch(SB+'/functions/v1/ler-comprovante',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+AK,apikey:AK},body:JSON.stringify({arquivo_base64:b,mime})});
  clearTimeout(t);const j=await r.json();if(!j.ok)throw j.erro||'falha';
  const d=j.dados,set=(i,x)=>{if(x!=null&&x!=='')$('#'+i).value=x};
  set('pv',d.valor!=null?String(d.valor).replace('.',','):null);set('pd',d.data_pagamento);set('pp',d.pagador_nome);set('pf',d.forma_pagamento);set('pt',d.transacao_id);
  const dn=norm(d.destinatario_nome),s=S.sup.find(x=>d.destinatario_documento&&x.doc==d.destinatario_documento)||(dn.length>3?S.sup.find(x=>{const n=norm(x.nome);return n&&(n.includes(dn)||dn.includes(n))}):null);
  if(s)$('#ps').value=s.id;
  say('✅ Leitura concluída. Confira os dados antes de enviar.'+(s?'':'<br>Fornecedor não identificado'+(d.destinatario_nome?' (destinatário lido: '+e(d.destinatario_nome)+')':'')+': selecione manualmente.')+((j.avisos||[]).map(a=>'<br>'+e(a)).join('')))
 }catch(x){say('Não consegui ler o comprovante automaticamente. Preencha os dados manualmente.',1)}}
// Leitura automática do comprovante de despesa avulsa. Se falhar, preenche manualmente.
async function lerDesp(inp){const f=inp.files[0],box=$('#iad');if(!f)return;
 const say=(t,w)=>{box.style.display='block';box.style.borderColor=w?'var(--o)':'var(--ok)';box.innerHTML=t};
 say('⏳ Lendo o comprovante…');
 try{let b,mime=f.type;
  if(mime=='application/pdf'){if(f.size>4e6)throw 'grande';b=await toB64(f)}
  else if(mime.startsWith('image/')){b=await shrink(f);mime='image/jpeg'}
  else throw 'tipo';
  const c=new AbortController(),t=setTimeout(()=>c.abort(),45000);
  const r=await fetch(SB+'/functions/v1/ler-comprovante',{method:'POST',signal:c.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+AK,apikey:AK},body:JSON.stringify({tipo:'despesa',arquivo_base64:b,mime})});
  clearTimeout(t);const j=await r.json();if(!j.ok)throw j.erro||'falha';
  const d=j.dados,set=(i,x)=>{if(x!=null&&x!=='')$('#'+i).value=x};
  set('ev',d.valor!=null?String(d.valor).replace('.',','):null);set('ex',d.data_compra);set('ed',d.descricao);set('ee',d.estabelecimento);set('ec',d.categoria);set('ef',d.forma_pagamento);set('ep',d.pagador_nome);
  say('✅ Leitura concluída. Confira os dados antes de registrar.'+((j.avisos||[]).map(a=>'<br>'+e(a)).join('')))
 }catch(x){say('Não consegui ler o comprovante automaticamente. Preencha os dados manualmente.',1)}}
const PAL=['#3f5736','#5b7a4f','#a9c192','#d99a06','#e8710a','#2f7ea8','#8e5ea2'];
const sv=(h,b)=>`<svg viewBox="0 0 600 ${h}" width="100%" role="img" style="color:var(--t)">${b}</svg>`;
const leg=(c,t)=>`<span style="margin-right:12px;font-size:13px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c}"></i> ${t}</span>`;
function barsC(lab,series,cols){const mx=Math.max(1,...series.flat()),n=lab.length,w=600/n,k=series.length;
 return sv(200,series.map((s,j)=>s.map((x,i)=>`<rect x="${i*w+j*(w-6)/k+3}" y="${170-x/mx*150}" width="${(w-6)/k-1}" height="${x/mx*150}" rx="2" fill="${cols[j]}"><title>${lab[i]}: ${R(x)}</title></rect>`).join('')).join('')+lab.map((l,i)=>n>12&&i%3?'':`<text x="${i*w+w/2}" y="190" font-size="11" text-anchor="middle" fill="#9db096">${l}</text>`).join('')+`<line x1="0" x2="600" y1="170" y2="170" stroke="#9db096"/>`)}
function lineC(lab,a){const mx=Math.max(1,...a),mn=Math.min(0,...a),n=a.length,pt=a.map((x,i)=>[n>1?10+i*580/(n-1):300,170-(x-mn)/(mx-mn||1)*150]);
 return sv(190,`<polyline fill="none" stroke="#5b7a4f" stroke-width="3" points="${pt.map(p=>p.join(',')).join(' ')}"/>`+pt.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#3f5736"><title>Dia ${lab[i]}: ${R(a[i])}</title></circle>`).join('')+`<line x1="0" x2="600" y1="170" y2="170" stroke="#9db096"/>`)}
function donut(en){en=en.filter(x=>x[1]>0).slice(0,7);const t=en.reduce((x,i)=>x+i[1],0);if(!t)return '<p class="m">Sem dados no período.</p>';let a=0;const c=2*Math.PI*60;
 const arcs=en.map(([k,x],i)=>{const f=x/t,s=`<circle r="60" cx="80" cy="80" fill="none" stroke="${PAL[i]}" stroke-width="28" stroke-dasharray="${f*c} ${c}" stroke-dashoffset="${-a*c}" transform="rotate(-90 80 80)"><title>${e(k)}: ${R(x)}</title></circle>`;a+=f;return s}).join('');
 return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--t)"><svg viewBox="0 0 160 160" width="160">${arcs}<text x="80" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${R(t)}</text></svg><div style="font-size:13px">${en.map(([k,x],i)=>`<div>${leg(PAL[i],e(k)+' · '+R(x))}</div>`).join('')}</div></div>`}
const exCat=(f,t)=>{const o={};S.exp.filter(x=>x.st=='ap'&&x.data>=f&&x.data<=t).forEach(x=>o[x.cat]=(o[x.cat]||0)+x.val);return Object.entries(o).sort((p,q)=>q[1]-p[1])};
function Dash(){const[a,b]=rng(mes),[y,o]=mes.split('-'),days=new Date(y,o,0).getDate(),
 nf=sum('nota_fiscal',l=>l.ts>=a&&l.ts<b),pg=-sum('pagamento',l=>l.ts>=a&&l.ts<b),dev=S.led.reduce((x,l)=>x+l.val,0),
